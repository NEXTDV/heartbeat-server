name: 배포 DB 스키마 내보내기

# 배포 DB의 표 구조(스키마)만 읽어 1일 보관 결과물로 올린다.
# 데이터·DB 계정·권한 정보는 포함하지 않으며, 배포 DB에 쓰기 작업을 하지 않는다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-dump:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 키 준비
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: 표 구조만 읽기
        env:
          SSH_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          SSH_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" 'bash -s' > schema.sql <<'REMOTE'
          set -euo pipefail
          POD="schema-dump-$(date +%s)"
          # 성공·실패와 상관없이 임시 pod는 마지막에 지운다
          trap 'sudo kubectl delete pod "$POD" -n heartbeat --ignore-not-found --wait=false >/dev/null 2>&1 || true' EXIT
          # DB 접속 정보는 클러스터 안 시크릿에서 바로 주입해 서버 밖으로 나가지 않게 한다
          OVERRIDES=$(cat <<JSON
          {"spec":{"hostNetwork":true,"dnsPolicy":"ClusterFirstWithHostNet","containers":[{"name":"$POD","image":"postgres:17-alpine",
          "envFrom":[{"secretRef":{"name":"heartbeat-secret"}}],
          "command":["sh","-c","U=\"\${DB_URL#jdbc:postgresql://}\"; U=\"\${U%%\\\\?*}\"; HP=\"\${U%%/*}\"; DB=\"\${U#*/}\"; H=\"\${HP%%:*}\"; P=\"\${HP#*:}\"; [ \"\$P\" = \"\$HP\" ] && P=5432; PGPASSWORD=\"\$DB_PASSWORD\" exec pg_dump --schema-only --no-owner --no-privileges -h \"\$H\" -p \"\$P\" -U \"\$DB_USERNAME\" \"\$DB\""]}]}}
          JSON
          )
          sudo kubectl run "$POD" -n heartbeat --restart=Never \
            --image=postgres:17-alpine --overrides="$OVERRIDES" >&2

          # pod에 붙어서 받으면 먼저 끝났을 때 출력을 놓치므로, 끝날 때까지 기다렸다가 기록을 읽는다
          PHASE=""
          for _ in $(seq 1 60); do
            PHASE=$(sudo kubectl get pod "$POD" -n heartbeat -o jsonpath='{.status.phase}' 2>/dev/null || true)
            case "$PHASE" in Succeeded|Failed) break ;; esac
            sleep 2
          done
          if [ "$PHASE" != "Succeeded" ]; then
            echo "임시 pod가 정상 종료되지 않았어요 (상태: ${PHASE:-알 수 없음})" >&2
            sudo kubectl describe pod "$POD" -n heartbeat 2>&1 | tail -n 20 >&2 || true
            sudo kubectl logs "$POD" -n heartbeat 2>&1 | tail -n 20 >&2 || true
            exit 1
          fi
          sudo kubectl logs "$POD" -n heartbeat
          REMOTE
          if [ ! -s schema.sql ]; then
            echo "::error::받아온 스키마가 비어 있어요"
            exit 1
          fi
          echo "스키마 $(wc -l < schema.sql)줄을 가져왔어요"

      - name: 결과 올리기 (1일 보관)
        uses: actions/upload-artifact@v4
        with:
          name: deployed-schema
          path: schema.sql
          retention-days: 1
