name: 멘션 알림

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 멘션 감지 → Discord 알림
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body;
            if (!body.includes('@jinlee1703')) return;

            const sender = context.payload.sender.login;
            const url = context.payload.comment.html_url;
            const preview = body.length > 80 ? body.slice(0, 80) + '...' : body;
            const content = `**[멘션]** @${sender} 님이 언급했습니다\n${preview}\n${url}`;

            await fetch(process.env.DISCORD_REVIEW_WEBHOOK_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ content })
            });
        env:
          DISCORD_REVIEW_WEBHOOK_URL: ${{ secrets.DISCORD_REVIEW_WEBHOOK_URL }}
