name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nextdv/heartbeat-server:latest
            ghcr.io/nextdv/heartbeat-server:${{ github.sha }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy k3s manifests to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "k3s/"
          target: "~/heartbeat-k3s"

      - name: Deploy to k3s
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            sudo kubectl apply -f ~/heartbeat-k3s/k3s/namespace.yaml
            sudo kubectl apply -f ~/heartbeat-k3s/k3s/service.yaml
            sudo kubectl apply -f ~/heartbeat-k3s/k3s/ingress.yaml
            sudo kubectl patch secret heartbeat-secret -n heartbeat \
              --patch='{"stringData":{"APP_SWAGGER_SERVER_URL":"${{ secrets.APP_SWAGGER_SERVER_URL }}"}}'
            # 이미지를 :latest 대신 커밋 SHA 태그로 지정해 실행 중인 버전을 추적하고 정확히 롤백할 수 있게 한다
            APPLIED=$(sed 's|ghcr.io/nextdv/heartbeat-server:latest|ghcr.io/nextdv/heartbeat-server:${{ github.sha }}|' \
              ~/heartbeat-k3s/k3s/deployment.yaml | sudo kubectl apply -f -)
            echo "$APPLIED"
            # 같은 커밋을 다시 배포하면 이미지가 그대로라 재시작되지 않으므로, 바뀐 시크릿 반영을 위해 직접 재시작한다
            case "$APPLIED" in
              *unchanged*) sudo kubectl rollout restart deployment/heartbeat -n heartbeat ;;
            esac
            sudo kubectl rollout status deployment/heartbeat -n heartbeat --timeout=120s
