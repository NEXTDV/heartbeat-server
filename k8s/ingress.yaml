apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heartbeat
  namespace: heartbeat
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: heartbeat.chapchu.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heartbeat
                port:
                  number: 8080
