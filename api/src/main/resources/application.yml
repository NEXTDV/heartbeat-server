spring:
  application:
    name: heartbeat-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nextdv}
    username: ${DB_USERNAME:nextdv}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html

heartbeat:
  platforms:
    - name: Claude
      category: AI
      healthCheckUrl: https://status.anthropic.com/api/v2/summary.json
      timeoutMs: 5000
      degradedThresholdMs: 2000
      iconUrl: https://www.anthropic.com/favicon.ico
    - name: ChatGPT
      category: AI
      healthCheckUrl: https://status.openai.com/api/v2/summary.json
      timeoutMs: 5000
