# 이 파일은 템플릿입니다. 실제 값은 서버에서 아래 명령어로 직접 생성하세요.
#
# kubectl create secret generic heartbeat-secret \
#   --namespace=heartbeat \
#   --from-literal=DB_URL=jdbc:postgresql://<HOST>:5432/nextdv \
#   --from-literal=DB_USERNAME=nextdv \
#   --from-literal=DB_PASSWORD=<PASSWORD> \
#   --from-literal=MAIL_HOST=smtp.gmail.com \
#   --from-literal=MAIL_PORT=587 \
#   --from-literal=MAIL_USERNAME=<EMAIL> \
#   --from-literal=MAIL_PASSWORD=<APP_PASSWORD>
apiVersion: v1
kind: Secret
metadata:
  name: heartbeat-secret
  namespace: heartbeat
type: Opaque
stringData:
  DB_URL: ""
  DB_USERNAME: ""
  DB_PASSWORD: ""
  MAIL_HOST: ""
  MAIL_PORT: ""
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
